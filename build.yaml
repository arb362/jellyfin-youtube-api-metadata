- "Google.Apis.Core.dll"
- "Google.Apis.Auth.dll"
- "Google.Apis.YouTube.v3.dll"
- "Newtonsoft.Json.dll"
- "System.CodeDom.dll"
- "System.Management.dll"
changelog: >
  Channel-name search: series folders without a [channelId] are resolved by name or @handle
  (exact match preferred, result cached), and the Identify dialog returns full channel details.
  Video files without a [videoId] are matched by title within their channel. Series now get
  keywords as tags, topic categories as genres, country, home page URL, and the channel banner
  as backdrop/banner images; episodes get topic categories as genres. New settings to toggle the
  name/title lookups and the Identify result count.
