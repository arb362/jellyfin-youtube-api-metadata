framework: "net10.0"
owner: "314"
overview: "YouTube metadata provider using the official YouTube Data API v3"
description: "Provides YouTube metadata (title, description, thumbnails, banners, channel info, keywords, topics) via the official YouTube Data API v3, without depending on yt-dlp. Finds channels by folder name or @handle and videos by file name. Requires Jellyfin 12.x; not compatible with Jellyfin 10.11.x."
category: "Metadata"
artifacts:
- "Jellyfin.Plugin.YoutubeApiMetadata.dll"
- "Google.Apis.dll"
- "Google.Apis.Core.dll"
- "Google.Apis.Auth.dll"
- "Google.Apis.YouTube.v3.dll"
- "Newtonsoft.Json.dll"
- "System.CodeDom.dll"
- "System.Management.dll"
changelog: >
  Fix: Identify returned no results when a handle or name was typed into the "YouTube" ID field
  (it was sent to the API as a channel ID, which silently matched nothing). Both Identify fields
  now accept a channel ID, an @handle, a channel name, or a pasted YouTube URL; videos accept a
  video ID or any video URL. A handle or name saved in a series' YouTube external ID is resolved
  and replaced with the real channel ID on the next refresh.
