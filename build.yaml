framework: "net10.0"
owner: "314"
overview: "YouTube metadata provider using the official YouTube Data API v3"
description: "Provides YouTube metadata (title, description, thumbnails, banners, channel info, keywords, topics) via the official YouTube Data API v3, without depending on yt-dlp. Finds channels by folder name or @handle and videos by file name. Requires Jellyfin 12.x; not compatible with Jellyfin 10.11.x."
category: "Metadata"
artifacts:
- "Jellyfin.Plugin.YoutubeApiMetadata.dll"
- "Google.Apis.dll"
- "Google.Apis.Core.dll"
- "Google.Apis.Auth.dll"
- "Google.Apis.YouTube.v3.dll"
- "Newtonsoft.Json.dll"
- "System.CodeDom.dll"
- "System.Management.dll"
changelog: >
  Fix: the API key is now read on every call, so a key saved in the settings page works
  immediately instead of only after a restart (0.3.0.0 and earlier always used the key present at
  startup - empty on a fresh install - and every lookup failed with "No YouTube Data API v3 key
  configured"). Lookups are now logged (handle/name searches, hit counts, picked channel).
  Includes 0.3.0.0: channel-name and @handle search for series folders, title search for video
  files, full channel/video metadata (keywords, topics, country, banner images).
